name: multiscreen_slingshot
description: "Party games played across several phones laid out on a table."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  forge2d: ^0.14.2+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.3.0
  rive: ^0.14.11
  flutter_svg: ^2.3.0
  purchases_flutter: ^10.9.0
  # Bonjour/mDNS discovery. UDP broadcast needs the multicast entitlement on
  # iOS, which Apple grants only on request; Bonjour needs none.
  # Pinned below 7.1.5 on purpose: that release needs Dart >=3.12 and this
  # project is on 3.11.5. Raise it after the SDK moves, not before.
  bonsoir: ^7.1.4
  url_launcher: ^6.3.2
  flutter_soloud: ^5.1.2
  material_symbols_icons: ^4.2785.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  # An asset directory is not scanned recursively, so each folder needs its own
  # line. SDK art is kept apart from any game's so that extracting lib/sdk/
  # into a package stays a `git mv`.
  assets:
    - assets/sdk/players/
    - assets/sdk/sfx/
    - assets/sdk/animations/
    - assets/sdk/screenshots/
    - assets/games/arena/
    - assets/games/copsrobbers/
    - assets/games/dodgeball/
    - assets/games/flood/
    - assets/games/guacamole/
    - assets/games/hotpotato/
    - assets/games/hungryhippos/
    - assets/games/paintwar/
    - assets/games/pitch_cars/
    - assets/games/subway_skater/
    # One file rather than the folder: the rest of assets/icons/ is app icons,
    # which have no business in the bundle.
    - assets/icons/LightSaber.riv
    - assets/icons/subwaySkater/
    - assets/icons/hotPotato/
    - assets/icons/pitchCars/
    - assets/icons/icones_minijeux/

  # Bundled rather than fetched: the app runs on a local network, often with no
  # internet, and a font arriving after the first frame is a layout that jumps.
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
